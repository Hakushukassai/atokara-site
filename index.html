<p class="synopsis">空から重さが降る世界で、人は崖の岩屋根の下の影に浮いて暮らしている。日なたで育って地面を踏んで水を担ぐ少年ノイは、ある朝、浮ける場所が少し奥へ縮んでいるのに気づく。</p>
